name: Build exe

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller pyperclip
      - run: pyinstaller --onefile --noconsole --name AutoLangSwitcher switcher_app.pyw
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/AutoLangSwitcher.exe
